
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הרצאות מוקלטות - משר"פ</title>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
      margin: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    header img {
      height: 90px;
    }
    h1 {
      font-size: 32px;
      color: #004d66;
      margin: 0;
      text-align: center;
    }
    .zoom-link {
      font-size: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .zoom-link a {
      color: #0077cc;
      font-weight: bold;
      text-decoration: none;
    }
    .ag-theme-alpine {
      height: 750px;
      width: 100%;
      direction: rtl;
    }
    .thumbnail {
      width: 100px;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="לוגו משרפ.png" alt="לוגו משרפ">
    <h1>הרצאות מוקלטות - משר"פ</h1>
  </header>

  <div class="zoom-link" id="zoomLink">
    🔄 טוען קישור זום קבוע...
  </div>

  <select id="pageSizeSelector" style="margin: 10px;"></select>
  <div id="myGrid" class="ag-theme-alpine"></div>

  <script>
    const sheetId = '16ihzH5s86uRcgTmwoXK0yd96-g_kZDuJ';
    const sheetName = 'Sheet1';
    const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${sheetName}`;
    const hyperlinkRegex = /HYPERLINK\("([^"]+)"/;

    function extractDriveId(link) {
      const match = link.match(/\/d\/([a-zA-Z0-9_-]+)\/view/);
      return match ? match[1] : null;
    }

    fetch(base)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substr(47).slice(0, -2));

        const zoomRaw = json.table.rows[0]?.c[0]?.f || "";
        const zoomMatch = zoomRaw.match(/HYPERLINK\("([^"]+)"/);
        const zoomLink = zoomMatch ? zoomMatch[1] : null;
        document.getElementById("zoomLink").innerHTML = zoomLink
          ? `📌 <strong>קישור קבוע להרצאות זום:</strong> <a href="${zoomLink}" target="_blank">לחץ כאן להצטרפות</a>`
          : '❌ קישור קבוע לא נמצא';

        const rows = json.table.rows.slice(2).map(row => {
          const rawDate = row.c[0]?.v || '';
          const dateObj = new Date(rawDate);
          const date = isNaN(dateObj.getTime()) ? '' : dateObj.toLocaleDateString("he-IL");
          const title = row.c[1]?.v || '';
          const lecturer = row.c[2]?.v || '';
          const recorded = row.c[3]?.v ? true : false;
          const fField = row.c[1] && typeof row.c[1].f === 'string' ? row.c[1].f : '';
          const link = recorded && hyperlinkRegex.test(fField)
            ? fField.match(hyperlinkRegex)[1]
            : null;
          const driveId = link ? extractDriveId(link) : null;
          const thumbnail = driveId
            ? `https://drive.google.com/thumbnail?id=${driveId}`
            : 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Video_icon2.svg/120px-Video_icon2.svg.png';

          return { date, title, lecturer, recorded, link, thumbnail };
        });

        const gridOptions = {
          columnDefs: [
            { headerName: 'תאריך', field: 'date', filter: true, sortable: true, width: 130 },
            {
              headerName: 'תמונה',
              field: 'thumbnail',
              width: 120,
              cellRenderer: params =>
                `<img src="${params.value}" class="thumbnail" alt="thumbnail">`
            },
            {
              headerName: 'נושא הרצאה',
              field: 'title',
              flex: 2,
              cellRenderer: params =>
                params.data.link
                  ? `<a href="${params.data.link}" target="_blank">${params.value}</a>`
                  : params.value
            },
            { headerName: 'שם מרצה', field: 'lecturer', flex: 1 },
            {
              headerName: 'צפייה',
              field: 'link',
              width: 100,
              cellRenderer: params =>
                params.value ? `<a href="${params.value}" target="_blank">🎥</a>` : '—'
            }
          ],
          rowData: rows,
          pagination: true,
          paginationPageSize: 20,
          defaultColDef: {
            resizable: true,
            filter: true,
            sortable: true
          },
          onGridReady: (params) => {
            const selector = document.getElementById('pageSizeSelector');
            [20, 40, 100].forEach(size => {
              const opt = document.createElement('option');
              opt.value = size;
              opt.text = `הצג ${size} שורות`;
              selector.appendChild(opt);
            });
            selector.value = 20;
            selector.addEventListener('change', e => {
              params.api.paginationSetPageSize(Number(e.target.value));
            });
          },
          localeText: {
            noRowsToShow: 'אין שורות להצגה',
            searchOoo: 'חיפוש...',
          }
        };

        new window.agGrid.Grid(document.getElementById('myGrid'), gridOptions);
      });
  </script>
</body>
</html>
