<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הרצאות מוקלטות - משר"פ</title>
  <script src="https://unpkg.com/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>
  <link href="https://unpkg.com/ag-grid-community/styles/ag-grid.css" rel="stylesheet" />
  <link href="https://unpkg.com/ag-grid-community/styles/ag-theme-alpine.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    header img {
      height: 60px;
    }
    h1 {
      color: #004d66;
    }
    .ag-theme-alpine {
      height: 700px;
      width: 100%;
      direction: rtl;
    }
    .ag-paging-panel {
      direction: ltr;
    }
  </style>
</head>
<body>
  <header>
    <h1>הרצאות מוקלטות - משר"פ</h1>
    <img src="לוגו משרפ.png" alt="לוגו משרפ">
  </header>

  <select id="pageSizeSelector" style="margin: 10px;"></select>
  <div id="myGrid" class="ag-theme-alpine"></div>

  <script>
    const sheetId = '16ihzH5s86uRcgTmwoXK0yd96-g_kZDuJ';
    const sheetName = 'Sheet1';
    const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${sheetName}`;

    fetch(base)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.map(row => {
          const date = row.c[0]?.v || '';
          const title = row.c[1]?.v || '';
          const lecturer = row.c[2]?.v || '';
          const recorded = row.c[3]?.v ? true : false;
          return {
            date,
            title,
            lecturer,
            recorded,
            link: recorded ? row.c[1].f.match(/https?:\/\/[^\s"]+/)?.[0] : null
          };
        });

        const gridOptions = {
          columnDefs: [
            { headerName: 'תאריך', field: 'date', filter: 'agDateColumnFilter' },
            { headerName: 'נושא הרצאה', field: 'title', flex: 2,
              cellRenderer: params =>
                params.data.link ? `<a href="${params.data.link}" target="_blank">${params.value}</a>` : params.value
            },
            { headerName: 'שם מרצה', field: 'lecturer', flex: 1 },
            { headerName: 'מוקלט', field: 'recorded', filter: true, cellRenderer: params => params.value ? '✔️' : '❌' }
          ],
          rowData: rows,
          defaultColDef: {
            sortable: true,
            filter: true,
            resizable: true,
          },
          animateRows: true,
          pagination: true,
          paginationPageSize: 20,
          paginationAutoPageSize: false,
          suppressPaginationPanel: false,
          onGridReady: (params) => {
            const sizeOptions = [20, 40, 100];
            const selector = document.getElementById('pageSizeSelector');
            sizeOptions.forEach(size => {
              const opt = document.createElement('option');
              opt.value = size;
              opt.innerText = `הצג ${size} שורות`;
              selector.appendChild(opt);
            });
            selector.value = 20;
            selector.addEventListener('change', e => {
              params.api.paginationSetPageSize(Number(e.target.value));
            });
          },
          localeText: {
            noRowsToShow: 'אין שורות להצגה',
            searchOoo: 'חיפוש...'
          }
        };

        new agGrid.Grid(document.getElementById('myGrid'), gridOptions);
      });
  </script>
</body>
</html>
