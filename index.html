
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>הרצאות מוקלטות - משר"פ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    header img {
      height: 90px;
    }
    h1 {
      font-size: 32px;
      color: #004d66;
      margin: 0;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img.thumbnail {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #ddd;
    }
    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title {
      font-size: 16px;
      font-weight: bold;
    }
    .card-date,
    .card-lecturer {
      font-size: 14px;
      color: #333;
    }
    .card-icons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .card-icons span {
      font-size: 20px;
      cursor: default;
    }
    .card-icons a {
      text-decoration: none;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="לוגו משרפ.png" alt="לוגו משרפ" />
    <h1>הרצאות מוקלטות - משר"פ</h1>
  </header>

  <div class="grid" id="lectureGrid"></div>

  <script>
    const sheetId = '16ihzH5s86uRcgTmwoXK0yd96-g_kZDuJ';
    const sheetName = 'Sheet1';
    const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${sheetName}`;
    const hyperlinkRegex = /HYPERLINK\("([^"]+)"/;

    function extractDriveId(link) {
      const match = link.match(/\/d\/([a-zA-Z0-9_-]+)\/view/);
      return match ? match[1] : null;
    }

    fetch(base)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.slice(2);
        const grid = document.getElementById('lectureGrid');

        rows.forEach(row => {
          const rawDate = row.c[0]?.v || '';
          const dateObj = new Date(rawDate);
          const date = isNaN(dateObj.getTime()) ? '' : dateObj.toLocaleDateString("he-IL");
          const title = row.c[1]?.v || '';
          const lecturer = row.c[2]?.v || '';
          const recorded = row.c[3]?.v ? true : false;
          const fField = row.c[1]?.f || '';
          const link = recorded && hyperlinkRegex.test(fField)
            ? fField.match(hyperlinkRegex)[1]
            : null;
          const driveId = link ? extractDriveId(link) : null;
          const thumbnail = driveId
            ? `https://drive.google.com/thumbnail?id=${driveId}`
            : 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Video_icon2.svg/320px-Video_icon2.svg.png';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img class="thumbnail" src="${thumbnail}" alt="thumbnail" />
            <div class="card-content">
              <div class="card-title">${title}</div>
              <div class="card-date">📅 ${date}</div>
              <div class="card-lecturer">👨‍⚕️ ${lecturer}</div>
              <div class="card-icons">
                ${recorded ? `<a href="${link}" target="_blank" title="צפייה בהרצאה">👁️</a>` : '<span title="אין הקלטה">❌</span>'}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
