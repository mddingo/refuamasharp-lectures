
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הרצאות מוקלטות - משר"פ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      margin: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    header img {
      height: 60px;
    }
    h1 {
      color: #004d66;
      margin: 0;
    }
    .zoom-link {
      font-size: 16px;
      margin-bottom: 20px;
    }
    .zoom-link a {
      color: #0077cc;
      font-weight: bold;
      text-decoration: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #ddd;
    }
    .card-content {
      padding: 15px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .card p {
      margin: 4px 0;
      font-size: 14px;
    }
    .card a.button {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 12px;
      background: #0077cc;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>הרצאות מוקלטות - משר"פ</h1>
    <img src="לוגו משרפ.png" alt="לוגו משרפ">
  </header>

  <div class="zoom-link">
    📌 <strong>קישור קבוע להרצאות זום:</strong>
    <a href="https://zoom.us/j/94648693344?pwd=MXgwRS9XRkNYcksyMEIxNWUzRk9XZz09" target="_blank">לחץ כאן להצטרפות</a>
  </div>

  <div class="grid" id="lectureGrid"></div>

  <script>
    const sheetId = '16ihzH5s86uRcgTmwoXK0yd96-g_kZDuJ';
    const sheetName = 'Sheet1';
    const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${sheetName}`;

    function extractDriveId(link) {
      const match = link.match(/\/d\/([a-zA-Z0-9_-]+)\/view/);
      return match ? match[1] : null;
    }

    fetch(base)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const hyperlinkRegex = /HYPERLINK\("([^"]+)"/;

        const grid = document.getElementById('lectureGrid');
        json.table.rows.forEach(row => {
          const date = row.c[0]?.v || '';
          const title = row.c[1]?.v || '';
          const lecturer = row.c[2]?.v || '';
          const recorded = row.c[3]?.v ? true : false;
          const fField = row.c[1] && typeof row.c[1].f === 'string' ? row.c[1].f : '';
          const link = recorded && hyperlinkRegex.test(fField)
            ? fField.match(hyperlinkRegex)[1]
            : null;

          const driveId = link ? extractDriveId(link) : null;
          const thumbnail = driveId ? `https://drive.google.com/thumbnail?id=${driveId}` : 'https://via.placeholder.com/320x180?text=No+Preview';

          if (title && date && lecturer) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <img src="${thumbnail}" alt="Thumbnail">
              <div class="card-content">
                <h3>${title}</h3>
                <p>📅 ${date}</p>
                <p>👨‍⚕️ ${lecturer}</p>
                ${link ? `<a class="button" href="${link}" target="_blank">צפה בהרצאה</a>` : ''}
              </div>
            `;
            grid.appendChild(card);
          }
        });
      });
  </script>
</body>
</html>
