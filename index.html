
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>בדיקת שורות גיליון</title>
</head>
<body>
  <h1>בדיקת שליפת שורות מהגיליון</h1>
  <pre id="output"></pre>

  <script>
    const sheetId = '16ihzH5s86uRcgTmwoXK0yd96-g_kZDuJ';
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=Sheet1`;

    fetch(url)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;
        const output = document.getElementById("output");
        rows.forEach((row, index) => {
          output.innerText += `שורה ${index + 1}: ` + JSON.stringify(row.c.map(cell => cell?.v || null)) + "\n";
        });
      })
      .catch(err => {
        document.getElementById("output").innerText = "שגיאה: " + err.message;
      });
  </script>
</body>
</html>
