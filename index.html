
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הרצאות ענף רפואה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      direction: rtl;
      padding: 20px;
    }
    header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    header img {
      height: 80px;
      margin-left: 20px;
    }
    h1 {
      font-size: 2em;
      margin: 0;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
    }
    .title {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 5px;
    }
    .lecturer {
      font-size: 0.9em;
      color: #333;
    }
    .eye {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 1.5em;
      color: green;
      cursor: pointer;
    }
    .no-video {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 1.5em;
      color: red;
    }
  </style>
</head>
<body>
  <header>
    <img src="לוגו משרפ.png" alt="לוגו משר"פ">
    <h1>הרצאות מוקלטות - ענף רפואה</h1>
  </header>
  <div class="grid" id="lectureGrid">טוען...</div>

  <script>
    function parseGoogleDate(val) {
      const match = val.match(/Date\((\d+),(\d+),(\d+)\)/);
      if (match) {
        const y = match[1];
        const m = (parseInt(match[2]) + 1).toString().padStart(2, '0');
        const d = match[3].padStart(2, '0');
        return `${d}-${m}-${y}`;
      }
      return '';
    }
    function normalizeDateString(str) {
      const parts = str.includes('-') ? str.split('-') : str.split('/');
      if (parts.length === 2) parts.push('2025');
      if (parts.length === 3) {
        const [d, m, y] = parts;
        const year = y.length === 2 ? (y > 50 ? '19' + y : '20' + y) : y;
        return `${d.padStart(2, '0')}-${m.padStart(2, '0')}-${year}`;
      }
      return '';
    }

    const sheetId = '16ihzH5s86uRcgTmwoXK0yd96-g_kZDuJ';
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=Sheet1`;

    fetch(url)
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;
        const grid = document.getElementById("lectureGrid");
        grid.innerHTML = "";
        rows.slice(1).forEach((row) => {
          if (!row.c || !row.c[1]) return;

          const dateCell = row.c[0];
          let rawDate = dateCell?.f || dateCell?.v || '';
          let date = '';
          if (typeof rawDate === 'string') {
            if (rawDate.includes('Date(')) {
              date = parseGoogleDate(rawDate);
            } else {
              date = normalizeDateString(rawDate);
            }
          }

          const topic = row.c[1]?.v || "";
          const lecturer = row.c[2]?.v || "";
          const videoLink = row.c[1]?.f ? row.c[1].f.match(/https[^"\)]+/)?.[0] : null;

          const card = document.createElement("div");
          card.className = "card";

          const dateDiv = document.createElement("div");
          dateDiv.textContent = '📅 ' + date;
          card.appendChild(dateDiv);

          const title = document.createElement("div");
          title.className = "title";
          title.textContent = topic;
          card.appendChild(title);

          const lect = document.createElement("div");
          lect.className = "lecturer";
          lect.textContent = `מרצה: ${lecturer}`;
          card.appendChild(lect);

          if (videoLink) {
            const eye = document.createElement("div");
            eye.className = "eye";
            eye.textContent = "👁️";
            eye.onclick = () => window.open(videoLink, '_blank');
            card.appendChild(eye);
          } else {
            const x = document.createElement("div");
            x.className = "no-video";
            x.textContent = "❌";
            card.appendChild(x);
          }

          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
